:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: Bento-Raster aus Haarlinien auf fast Schwarz, alles Monospace, Digitalanzeige für Zahlen und Titel,
   Sortenfarben als flache, gedeckte Farbblöcke, Leiste unten als eckiges Bedienfeld */
:root {
  --bg: #0a0a0b;
  --cell: #111113;
  --cell-2: #19191c;
  --line: #262629;
  --line-2: #3a3a3f;
  --fg: #e9e6df;
  --muted: #7c7a74;
  --dim: #4a4945;
  --sand: #bfbaa9;
  --sand-fg: #121211;
  --blue: #5d7cab;
  --green: #7c9c68;
  --pink: #c4879f;
  --warn: #d7a445;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-lcd: "Tiny5", "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-mono); font-size: 14px; line-height: 1.4; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 1px solid var(--sand); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: square; stroke-linejoin: miter; flex: none; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(108px + env(safe-area-inset-bottom, 0px)); }

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; gap: 12px; min-height: 66px; padding-block: 10px 10px; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.top .back { width: 40px; height: 40px; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; color: var(--fg); border-radius: 2px; transition: background-color .15s; }
.top .back:active { background: var(--cell-2); }
.top .back[hidden] { display: none !important; }
.top .title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.top .title b { font-family: var(--font-lcd); font-weight: 400; font-size: 26px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.top .title > span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.path { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.path .sep { color: var(--dim); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--line-2); color: var(--fg); border-radius: 2px; animation: pillIn .25s var(--ease) both; }
.pill svg.i { width: 13px; height: 13px; }
.pill[class*="t-"] { background: var(--tc); border-color: var(--tc); color: var(--sand-fg); }
.pill[class*="t-"] svg.i { display: none; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 8px; display: flex; align-items: center; gap: 8px; }
.label::before { content: "["; color: var(--dim); }
.label::after { content: "]"; color: var(--dim); }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.demo { font-size: 12px; color: var(--warn); border: 1px solid rgba(215,164,69,.35); padding: 8px 10px; margin: 0 0 12px; }

/* Sortenfarben */
.t-sprudel { --tc: var(--blue); }
.t-medium { --tc: var(--green); }
.t-naturell { --tc: var(--pink); }

/* Ansichtswechsel */
.in-fwd > * { animation: inFwd .24s var(--ease) both; }
.in-back > * { animation: inBack .24s var(--ease) both; }
.in-fade > * { animation: inFade .2s ease both; }
@keyframes inFwd { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes inBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@keyframes inFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pillIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }

/* Bildschirmfüllend */
.screen { display: flex; flex-direction: column; gap: 8px; min-height: var(--avail, calc(100dvh - 190px)); }
.screen > .stage { flex: 1; }
.screen > .dock { margin-top: 0; }
.screen > .demo { margin: 0; }
.screen > .hint { margin: 2px 0 0; }

/* Kacheln: Zellen im Raster */
.stage { display: grid; gap: 8px; }
.stage.two { grid-template-columns: 1fr 1fr; }
.stage > .tile { animation: rise .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
.tile {
  position: relative; border: 1px solid var(--line); background: var(--cell); border-radius: 3px;
  padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; overflow: hidden;
  transition: transform .12s var(--ease), border-color .15s, background-color .15s;
}
.tile:active { transform: scale(.985); border-color: var(--sand); }
.tile:disabled { opacity: .3; cursor: default; }
.tile b { font-family: var(--font-lcd); font-weight: 400; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }

.mono { min-width: 34px; height: 26px; padding: 0 6px; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--muted); flex: none; transition: all .18s var(--ease); border-radius: 2px; }

/* Knöpfe */
.dock { display: flex; gap: 8px; margin-top: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: transparent; padding: 12px 14px; border-radius: 2px; font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; min-height: 50px; transition: transform .1s var(--ease), background-color .15s, color .15s; }

.pos { font-size: 11px; color: var(--muted); width: 20px; text-align: right; flex: none; }
.empty { text-align: center; padding: 34px 18px; color: var(--muted); border: 1px dashed var(--line-2); display: grid; gap: 14px; justify-items: center; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
.empty .glyph svg.i { width: 44px; height: 44px; }

/* Bottom-Sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.7); animation: inFade .2s ease both; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto; background: var(--cell); border-top: 1px solid var(--line-2); padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .26s var(--ease) both; }

@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }

.counter { display: grid; grid-template-columns: 84px 1fr 84px; align-items: stretch; margin: 16px 0 12px; border: 1px solid var(--line-2); }
.counter button { height: 96px; border: 0; background: transparent; display: grid; place-items: center; transition: background-color .12s; }

.counter button:last-child { border-left: 1px solid var(--line-2); }
.counter button svg.i { width: 30px; height: 30px; stroke-width: 1.6; }
.counter button:active { background: var(--sand); color: var(--sand-fg); }
.counter output { text-align: center; display: grid; place-content: center; gap: 2px; overflow: hidden; }

.counter output b.up { animation: numUp .2s var(--ease); }
.counter output b.down { animation: numDown .2s var(--ease); }
@keyframes numUp { from { transform: translateY(40%); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes numDown { from { transform: translateY(-40%); opacity: .2; } to { transform: none; opacity: 1; } }

.quick { display: grid; grid-template-columns: repeat(5, 1fr); margin-bottom: 14px; border: 1px solid var(--line-2); }
.quick button { height: 46px; border: 0; border-left: 1px solid var(--line-2); background: transparent; font-family: var(--font-lcd); font-weight: 400; font-size: 19px; color: var(--muted); transition: background-color .15s, color .15s; }
.quick button:first-child { border-left: 0; }
.quick button[aria-pressed="true"] { background: var(--sand); color: var(--sand-fg); }

/* Tragen */
.focus { width: 100%; border: 1px solid var(--line-2); border-radius: 3px; color: var(--fg); background: var(--cell); flex: 1; min-height: 330px; display: flex; flex-direction: column; align-items: stretch; text-align: left; overflow: hidden; padding: 0; transition: transform .12s var(--ease); }
.focus:active { transform: scale(.99); }
.focus.enter-fwd { animation: cardIn .28s var(--ease) both; }
.focus.enter-back { animation: cardBack .28s var(--ease) both; }

@keyframes cardIn { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }

.focus .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
/* Segmentierter Balken wie eine Füllstandsanzeige */
.focus .head .bar { flex: 1; height: 16px; position: relative; background: repeating-linear-gradient(90deg, var(--line-2) 0 2px, transparent 2px 5px); }

.focus .mid { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 14px 12px; }
.focus .brand { font-family: var(--font-lcd); font-weight: 400; font-size: clamp(32px, 10vw, 50px); line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }

.focus .big { font-family: var(--font-lcd); font-weight: 400; font-size: clamp(110px, 36vw, 168px); line-height: .9; font-variant-numeric: tabular-nums; align-self: flex-end; margin-top: auto; }
.focus .unit { font-size: 11px; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; align-self: flex-end; }
.focus .unit::before { content: "[ "; color: var(--dim); }
.focus .unit::after { content: " ]"; color: var(--dim); }
.focus .go { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--sand); color: var(--sand-fg); font-size: 15px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: 20px 16px; }
.focus .go svg.i { width: 20px; height: 20px; stroke-width: 2.2; }
.next { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin: 2px 0; text-transform: uppercase; letter-spacing: .04em; }
.next b { color: var(--fg); font-weight: 500; }
.next svg.i { width: 14px; height: 14px; }
.screen > .alldone { flex: 1; align-content: center; }
.alldone { border: 1px solid var(--line-2); padding: 44px 18px; text-align: center; background: var(--cell); display: grid; gap: 12px; justify-items: center; animation: rise .3s var(--ease) both; }
.alldone .ring { width: 72px; height: 72px; border: 1px solid var(--sand); color: var(--sand); display: grid; place-items: center; animation: popIn .4s var(--ease) .1s both; }
.alldone .ring svg.i { width: 36px; height: 36px; stroke-width: 2; }
.alldone .ring svg.i use { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s ease-out .3s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.alldone b { font-family: var(--font-lcd); font-weight: 400; font-size: 30px; line-height: 1; text-transform: uppercase; }
.alldone .hint { text-transform: uppercase; letter-spacing: .08em; }
li.done strong { color: var(--dim); text-decoration: line-through; }
li.done .num { color: var(--dim); }
li.done .num::before, li.done .num::after { content: none; }
.chk { width: 26px; height: 26px; border: 1px solid var(--line-2); display: grid; place-items: center; flex: none; transition: all .18s var(--ease); }
.chk svg.i { width: 15px; height: 15px; stroke-width: 2.4; opacity: 0; transform: scale(.5); transition: all .18s var(--ease); }
li.done .chk { background: var(--sand); border-color: var(--sand); color: var(--sand-fg); }

/* Einstellungen */
.panel { border: 1px solid var(--line); background: var(--cell); padding: 12px; }

.seg.right .thumb { transform: translateX(100%); }

.seg button[aria-pressed="true"] { color: var(--sand-fg); }

.ib:active { background: var(--cell-2); color: var(--fg); }

.row > * { flex: 1 1 120px; min-width: 0; }
.msg { font-size: 12px; color: var(--sand); min-height: 1.2em; margin-top: 8px; }
.msg.err { color: var(--warn); }

nav.dockbar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 20; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 4px; border-radius: 4px; background: rgba(17,17,19,.94); border: 1px solid var(--line-2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: min(calc(100% - 24px), 440px); }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 25; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 24px), 440px); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; background: var(--cell-2); border: 1px solid var(--line-2); border-radius: 3px; animation: toastIn .26s var(--ease) both; }
.toast.out { animation: toastOut .2s ease-in both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 10px); } }
.toast .dot { width: 24px; height: 24px; display: grid; place-items: center; flex: none; background: var(--sand); color: var(--sand-fg); }
.toast .dot.off { background: var(--line-2); color: var(--fg); }

.toast span { flex: 1; min-width: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
.toast span b { font-weight: 500; color: var(--fg); }
.toast button { border: 1px solid var(--line-2); background: transparent; color: var(--fg); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px; display: inline-flex; gap: 6px; align-items: center; border-radius: 2px; }
.toast button svg.i { width: 13px; height: 13px; }


/* Markenwahl als Periodensystem: großes Kürzel, Name klein darunter, Laufweg-Nummer oben links */
.stage.brands { display: grid; grid-auto-rows: 1fr; }
.stage.brands.cols-1 { grid-template-columns: 1fr; }
.stage.brands.cols-2 { grid-template-columns: 1fr 1fr; }
.stage.brands.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.stage.brands .tile.el { min-height: 96px; padding: 10px 10px 10px; gap: 0; justify-content: space-between; align-items: stretch; border-top: 3px solid var(--tc); }
.tile.el .nr { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
.tile.el .sym { text-transform: uppercase; font-family: var(--font-lcd); font-weight: 400; font-size: clamp(34px, 11vw, 54px); line-height: 1; align-self: center; margin-block: auto; letter-spacing: .02em; }

.tile.el .mono { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; padding: 0; border: 1px solid var(--line-2); }
.tile.el .mono svg.i { width: 14px; height: 14px; }
.tile.el.marked, .tile.el.flash { background: var(--sand); border-color: var(--sand); border-top-color: var(--tc); color: var(--sand-fg); }
.tile.el.marked .nr, .tile.el.marked .nm, .tile.el.flash .nr, .tile.el.flash .nm { color: rgba(18,18,17,.65); }
.tile.el.marked .mono, .tile.el.flash .mono { background: var(--sand-fg); border-color: var(--sand-fg); color: var(--sand); }

/* Blinkender Cursor hinter dem Titel */
.top .title b::after { content: "_"; margin-left: 2px; animation: blink 1.1s steps(1) infinite; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="7" r=".6"/><circle cx="15" cy="7" r=".6"/><circle cx="9" cy="12" r=".6"/><circle cx="15" cy="12" r=".6"/><circle cx="9" cy="17" r=".6"/><circle cx="15" cy="17" r=".6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 13.5L4.5 9.5l4-4"/><path d="M4.5 9.5h9.5a5 5 0 0 1 0 10H11"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="5" width="3" height="3" rx=".8"/><rect x="4" y="10.5" width="3" height="3" rx=".8"/><rect x="4" y="16" width="3" height="3" rx=".8"/><path d="M10.5 6.5H20M10.5 12H20M10.5 17.5H17"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 7l5 5-5 5"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 5v5h5"/><path d="M5.6 15.5a7 7 0 1 0 .9-7.5L4.5 10"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M15 5.5V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h.5"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 12.6V5a1 1 0 0 1 1-1h7.6l7.4 7.4a1.4 1.4 0 0 1 0 2l-6.6 6.6a1.4 1.4 0 0 1-2 0z"/><circle cx="8.5" cy="8.5" r="1.2"/></symbol>
    <!-- Glas: Perlenflasche mit Perlenring an der Schulter -->
    <symbol id="i-glas" viewBox="0 0 24 24"><path d="M10 2.5h4"/><path d="M10.3 2.5v3.3c0 1.3-2.8 2.2-2.8 4.8V20a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5v-9.4c0-2.6-2.8-3.5-2.8-4.8V2.5"/><path d="M7.5 15h9M7.5 18.5h9"/><g fill="currentColor" stroke="none"><circle cx="9.4" cy="10.6" r=".55"/><circle cx="11.13" cy="10.6" r=".55"/><circle cx="12.87" cy="10.6" r=".55"/><circle cx="14.6" cy="10.6" r=".55"/><circle cx="10.27" cy="12.2" r=".55"/><circle cx="12" cy="12.2" r=".55"/><circle cx="13.73" cy="12.2" r=".55"/></g></symbol>
    <!-- Plastik: Kunststoffflasche mit Deckel und Rillen -->
    <symbol id="i-pet" viewBox="0 0 24 24"><rect x="9.8" y="2" width="4.4" height="2.6" rx=".6"/><path d="M10.3 4.6v.9c0 1.4-2.8 2.4-2.8 4.6V20a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5V10.1c0-2.2-2.8-3.2-2.8-4.6v-.9"/><path d="M7.5 12c2.8 1 6.2 1 9 0M7.5 15.5c2.8 1 6.2 1 9 0"/></symbol>
    <!-- Kohlensäure -->
    <symbol id="i-sprudel" viewBox="0 0 24 24"><circle cx="8" cy="17.5" r="2.7"/><circle cx="15.3" cy="15" r="2"/><circle cx="10.5" cy="10.6" r="1.7"/><circle cx="16" cy="8.4" r="1.3"/><circle cx="11.6" cy="4.8" r="1"/><circle cx="7" cy="6.6" r=".8"/></symbol>
    <symbol id="i-medium" viewBox="0 0 24 24"><circle cx="9.2" cy="16" r="2.8"/><circle cx="14.8" cy="10.2" r="1.9"/><circle cx="11" cy="5.6" r="1.1"/></symbol>
    <symbol id="i-naturell" viewBox="0 0 24 24"><path d="M12 3.5c2.7 3.4 6 7 6 10.6a6 6 0 0 1-12 0C6 10.5 9.3 6.9 12 3.5z"/><path d="M9.3 14.4a2.8 2.8 0 0 0 2.3 2.7"/></symbol>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <button type="button" class="back" id="backBtn" aria-label="Zurück" hidden><svg class="i"><use href="#i-back"/></svg></button>
    <div class="title"><b id="topTitle">Lager</b><span id="topSub"></span></div>
  </header>
  <section id="v-lager" hidden></section>
  <section id="v-laden" hidden></section>
  <section id="v-tragen" hidden></section>
  <section id="v-settings" hidden></section>
</div>

<div id="overlay"></div>
<div id="toastHost"></div>
<nav class="dockbar" aria-label="Ansicht"><div class="tabs" id="dock"></div></nav>

<script>
(() => {
  const KEY = 'kistenliste.v2';
  const PACK = { glas: 'Glas', pet: 'Plastik' }, PACKS = ['glas', 'pet'];
  const TYP = { medium: 'Medium', sprudel: 'Sprudel', naturell: 'Still' }, TYPS = ['sprudel', 'medium', 'naturell'];
  /* Echtes Sortiment in Laufweg-Reihenfolge. Blau = sprudel, Grün = medium, Pink = naturell (Still) */
  const SEED = 4;
  const SORTIMENT = [
    ['Engelbert', 'glas', 'sprudel'], ['Engelbert', 'glas', 'medium'], ['Engelbert', 'glas', 'naturell'],
    ['Engelbert', 'pet', 'naturell'], ['Engelbert', 'pet', 'medium'], ['Engelbert', 'pet', 'sprudel'],
    ['Salinger', 'glas', 'sprudel'], ['Salinger', 'glas', 'medium'],
    ['Heiligenthaler', 'glas', 'sprudel'], ['Heiligenthaler', 'glas', 'medium'], ['Heiligenthaler', 'glas', 'naturell'],
    ['Kastell', 'glas', 'medium'], ['Kastell', 'glas', 'naturell'],
    ['Landpark', 'glas', 'naturell'], ['Landpark', 'glas', 'medium'],
    ['Stiftsquelle', 'glas', 'sprudel'], ['Stiftsquelle', 'glas', 'medium'], ['Stiftsquelle', 'glas', 'naturell'],
    ['Forstetal', 'glas', 'medium'], ['Forstetal', 'glas', 'naturell'], ['Forstetal', 'glas', 'sprudel'],
    ['Schlossquelle', 'glas', 'medium'], ['Schlossquelle', 'glas', 'sprudel'],
    ['Steinsieker', 'glas', 'medium'], ['Steinsieker', 'glas', 'sprudel'],
    ['Brohler', 'glas', 'sprudel'], ['Brohler', 'glas', 'medium'],
    ['Gerolsteiner', 'glas', 'medium'], ['Gerolsteiner', 'glas', 'sprudel'], ['Gerolsteiner', 'glas', 'naturell'],
    ['Gerolsteiner', 'pet', 'naturell'], ['Gerolsteiner', 'pet', 'medium'], ['Gerolsteiner', 'pet', 'sprudel'],
    ['Heiligenthaler', 'pet', 'sprudel'], ['Heiligenthaler', 'pet', 'medium'],
    ['Burgwallbronn', 'pet', 'medium'], ['Burgwallbronn', 'pet', 'sprudel'],
    ['Forstetal', 'pet', 'medium'], ['Forstetal', 'pet', 'sprudel'],
    ['Stiftsquelle', 'pet', 'medium'], ['Stiftsquelle', 'pet', 'naturell']
  ];
  const uid = () => Math.random().toString(36).slice(2, 9);
  const normName = n => { const k = String(n).trim().toLowerCase(); return ({ castell: 'kastell', brola: 'brohler' })[k] || k; };
  /* Baut Marken und Laufweg aus dem Sortiment. Vorhandene Sorten behalten ihre ID (Markierungen bleiben),
     Sorten, die nicht im Sortiment stehen, fallen weg. */
  function buildFromSortiment(oldBrands, oldSorten) {
    const brands = [], sorten = [], byName = {};
    const brandFor = name => {
      const k = normName(name);
      if (!byName[k]) { const old = oldBrands.find(b => normName(b.name) === k); byName[k] = { id: old ? old.id : uid(), name }; brands.push(byName[k]); }
      return byName[k];
    };
    const oldName = id => (oldBrands.find(b => b.id === id) || { name: '' }).name;
    const used = new Set();
    SORTIMENT.forEach(([name, pack, typ]) => {
      const b = brandFor(name);
      const old = oldSorten.find(o => !used.has(o.id) && o.pack === pack && o.typ === typ && normName(oldName(o.b)) === normName(name));
      const id = old ? old.id : uid(); used.add(id);
      sorten.push({ id, b: b.id, pack, typ });
    });
    return { brands, sorten };
  }
  const fresh = () => {
    const { brands, sorten } = buildFromSortiment([], []);
    return { v: 2, seed: SEED, mode: 'lager', tab: 'lager', demo: false, brands, sorten, avail: {}, bedarf: {}, done: {}, doneOrder: [], nav: { pack: null, typ: null } };
  };
  let state = null;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!state || !Array.isArray(state.sorten) || !Array.isArray(state.brands)) state = fresh();
  ['avail', 'bedarf', 'done'].forEach(k => { if (!state[k]) state[k] = {}; });
  if (!Array.isArray(state.doneOrder)) state.doneOrder = [];
  if ((state.seed || 1) < SEED) {
    const { brands, sorten } = buildFromSortiment(state.brands, state.sorten);
    const ids = new Set(sorten.map(x => x.id));
    ['avail', 'bedarf', 'done'].forEach(k => Object.keys(state[k]).forEach(id => { if (!ids.has(id)) delete state[k][id]; }));
    state.doneOrder = state.doneOrder.filter(id => ids.has(id));
    state.brands = brands; state.sorten = sorten; state.seed = SEED; state.demo = false;
  }
  state.nav = { pack: null, typ: null };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const reduced = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
  const later = (fn, ms) => reduced ? fn() : setTimeout(fn, ms);

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = v => { v = parseInt(v, 10); return isNaN(v) || v < 0 ? 0 : Math.min(v, 999); };
  const ic = (n, cls) => `<svg class="i${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const brandName = id => (state.brands.find(b => b.id === id) || { name: '?' }).name;
  const brandIdx = id => state.brands.findIndex(b => b.id === id);
  /* Eindeutige Kürzel wie im Periodensystem: erster Buchstabe plus nächster noch freier Buchstabe (Stiftsquelle St, Steinsieker Se) */
  function brandCodes() {
    const used = new Set(), m = {};
    state.brands.forEach(b => {
      const n = String(b.name || '').replace(/[^A-Za-zÄÖÜäöüß]/g, '') || '?';
      const f = n[0].toUpperCase();
      let c = null;
      for (let i = 1; i < n.length && !c; i++) { const t = f + n[i].toLowerCase(); if (!used.has(t)) c = t; }
      if (!c) c = f + (used.size % 10);
      used.add(c); m[b.name] = c;
    });
    return m;
  }
  const initials = name => brandCodes()[name] || String(name).slice(0, 2);
  const sorte = id => state.sorten.find(s => s.id === id);
  const tags = s => `<span class="tags"><span class="tag">${ic(s.pack)}${PACK[s.pack]}</span><span class="tag t-${s.typ}">${ic(s.typ)}${TYP[s.typ]}</span></span>`;
  const label = s => `${brandName(s.b)} ${PACK[s.pack]} ${TYP[s.typ]}`;

  const ladenSorten = () => state.sorten.filter(s => state.mode === 'laden' || state.avail[s.id]);
  const tragenSorten = () => ladenSorten().filter(s => (state.bedarf[s.id] || 0) > 0);
  const openSorten = () => tragenSorten().filter(s => !state.done[s.id]);

  function animate(el, kind) {
    if (reduced) return;
    el.classList.remove('in-fwd', 'in-back', 'in-fade'); void el.offsetWidth; el.classList.add('in-' + kind);
  }
  function arm(btn, armedText, cb) {
    if (btn.dataset.armed === '1') { clearTimeout(btn._t); btn.dataset.armed = ''; cb(); return; }
    const normal = btn.innerHTML;
    btn.dataset.armed = '1'; btn.textContent = armedText;
    btn._t = setTimeout(() => { btn.dataset.armed = ''; btn.innerHTML = normal; }, 3000);
  }
  function newRound() {
    state.avail = {}; state.bedarf = {}; state.done = {}; state.doneOrder = []; state.nav = { pack: null, typ: null };
    save(); setTab(state.mode === 'lager' ? 'lager' : 'laden');
  }

  /* ---------- Toast ---------- */
  let toastT = null, undoFn = null;
  function hideToast() { const t = $('toastHost').firstElementChild; if (!t) return; t.classList.add('out'); later(() => { if ($('toastHost').firstElementChild === t) $('toastHost').innerHTML = ''; }, 200); }
  function toast(text, on, undo) {
    clearTimeout(toastT); undoFn = undo || null;
    $('toastHost').innerHTML = `<div class="toast" role="status"><span class="dot${on ? '' : ' off'}">${ic(on ? 'check' : 'x')}</span><span>${text}</span>${undo ? `<button type="button" id="toastUndo">${ic('undo')}Rückgängig</button>` : ''}</div>`;
    toastT = setTimeout(() => { undoFn = null; hideToast(); }, 3200);
  }
  $('toastHost').addEventListener('click', e => {
    if (e.target.closest('#toastUndo') && undoFn) { const f = undoFn; undoFn = null; clearTimeout(toastT); hideToast(); f(); }
  });

  /* ---------- Kopf ---------- */
  function setTop(title, sub, back) {
    $('topTitle').textContent = title; $('topSub').innerHTML = sub || '';
    $('backBtn').hidden = !back; $('backBtn').onclick = back || null;
  }

  /* ---------- Lager ---------- */
  let busy = false;
  function renderLager(dir) {
    const { pack, typ } = state.nav;
    const markedN = Object.keys(state.avail).length;
    let h = '<div class="screen">';
    if (!pack) {
      setTop('Lager', markedN ? `${markedN} ${markedN === 1 ? 'Sorte' : 'Sorten'} markiert` : 'Was steht im Lager?', null);
      if (state.demo) h += '<p class="demo">Demo: Marken und Sorten sind Platzhalter. In den Einstellungen anpassen.</p>';
      h += '<div class="stage two">';
      PACKS.forEach((p, i) => {
        const l = state.sorten.filter(s => s.pack === p), got = l.filter(s => state.avail[s.id]).length;
        h += `<button type="button" class="tile" style="--i:${i}" data-pack="${p}" data-code="${p === 'glas' ? 'GL' : 'PL'}"${l.length ? '' : ' disabled'}><span class="glyph">${ic(p)}</span><span class="meta"><b>${PACK[p]}</b><small>${l.length} Sorten${got ? ` · <span class="got">${got} da</span>` : ''}</small></span></button>`;
      });
      h += '</div>';
      h += `<div class="dock"><button type="button" class="btn" data-review="1"${markedN ? '' : ' disabled'}>${ic('list')}${markedN} markiert</button>
        <button type="button" class="btn primary" data-go="laden"${markedN ? '' : ' disabled'}>Zum Laden ${ic('arrow', 'arrow')}</button></div>`;
    } else if (!typ) {
      setTop(PACK[pack], `<span class="path"><span class="pill">${ic(pack)}${PACK[pack]}</span></span>`, () => { state.nav = { pack: null, typ: null }; renderLager('back'); });
      h += '<div class="stage three">';
      TYPS.forEach((t, i) => {
        const l = state.sorten.filter(s => s.pack === pack && s.typ === t), got = l.filter(s => state.avail[s.id]).length;
        h += `<button type="button" class="tile t-${t}" style="--i:${i}" data-typ="${t}" data-code="${({ sprudel: 'SP', medium: 'ME', naturell: 'ST' })[t]}"${l.length ? '' : ' disabled'}><span class="glyph">${ic(t)}</span><span class="meta"><b>${TYP[t]}</b><small>${l.length ? `${l.length} Marken${got ? ` · <span class="got">${got} da</span>` : ''}` : 'keine Sorten'}</small></span>${ic('chev', 'chev')}</button>`;
      });
      h += '</div>';
    } else {
      setTop('Marke wählen', `<span class="path"><span class="pill">${ic(pack)}${PACK[pack]}</span><span class="sep">/</span><span class="pill t-${typ}">${ic(typ)}${TYP[typ]}</span></span>`, () => { state.nav.typ = null; renderLager('back'); });
      const l = state.sorten.filter(s => s.pack === pack && s.typ === typ).sort((a, b) => brandIdx(a.b) - brandIdx(b.b));
      const cols = l.length <= 2 ? 1 : l.length <= 6 ? 2 : 3;
      h += `<div class="stage brands t-${typ} cols-${cols}">`;
      l.forEach((s, i) => {
        const on = !!state.avail[s.id], n = brandName(s.b);
        const nr = String(state.sorten.indexOf(s) + 1).padStart(2, '0');
        h += `<button type="button" class="tile el${on ? ' marked' : ''}" style="--i:${i}" data-avail="${s.id}" aria-pressed="${on}" aria-label="${esc(n)}"><span class="nr">${nr}</span><span class="mono">${on ? ic('check') : ''}</span><span class="sym">${esc(initials(n))}</span><span class="nm">${esc(n)}</span></button>`;
      });
      h += '</div><p class="hint">Antippen markiert und springt zurück. Beige sind schon markiert, nochmal tippen entfernt sie.</p>';
    }
    h += '</div>';
    const el = $('v-lager'); el.innerHTML = h;
    measure();
    if (dir) animate(el, dir);
  }
  function openReview() {
    const list = state.sorten.filter(s => state.avail[s.id]);
    $('overlay').innerHTML = `<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-label="Markierte Sorten"><div class="grab"></div>
      <div class="shead"><span class="mono">${ic('lager')}</span><div><h3>Im Lager markiert</h3><span class="hint" style="margin:0">${list.length} ${list.length === 1 ? 'Sorte' : 'Sorten'}</span></div></div>
      <ul class="list anim" style="max-height:50dvh;overflow:auto;margin-top:16px">${list.map((s, i) => `<li style="--i:${i}"><div class="name"><strong>${esc(brandName(s.b))}</strong>${tags(s)}</div><button type="button" class="ib" data-unmark="${s.id}" aria-label="${esc(label(s))} entfernen">${ic('x')}</button></li>`).join('')}</ul>
      <div class="dock"><button type="button" class="btn" data-close="1">Schließen</button></div></div>`;
  }
  $('v-lager').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t || busy) return;
    if (t.dataset.pack) { state.nav = { pack: t.dataset.pack, typ: null }; renderLager('fwd'); scrollTo(0, 0); }
    else if (t.dataset.typ) { state.nav.typ = t.dataset.typ; renderLager('fwd'); scrollTo(0, 0); }
    else if (t.dataset.avail) {
      const id = t.dataset.avail, was = !!state.avail[id];
      if (was) delete state.avail[id]; else state.avail[id] = true;
      save();
      const back = { ...state.nav };
      const mono = t.querySelector('.mono');
      t.classList.add(was ? 'unflash' : 'flash'); t.classList.toggle('marked', !was);
      if (mono) mono.innerHTML = was ? '' : ic('check');
      busy = true;
      later(() => {
        busy = false;
        state.nav = { pack: null, typ: null }; renderLager('back'); renderDock(); scrollTo(0, 0);
        toast(`<b>${esc(label(sorte(id)))}</b> ${was ? 'entfernt' : 'markiert'}`, !was, () => {
          if (was) state.avail[id] = true; else delete state.avail[id];
          save(); state.nav = back; renderLager('fwd'); renderDock();
        });
      }, 340);
    }
    else if (t.dataset.review) openReview();
    else if (t.dataset.go) setTab('laden');
  });

  /* ---------- Laden ---------- */
  let editId = null, bumpId = null;
  function renderLaden(anim) {
    const list = ladenSorten();
    const k = list.reduce((a, s) => a + (state.bedarf[s.id] || 0), 0);
    setTop('Laden', list.length ? `${list.length} Sorten · ${k} Kisten eingetragen` : 'Fehlende Kisten eintragen', null);
    let h = '';
    if (!list.length) {
      h = `<div class="empty"><span class="glyph">${ic('lager')}</span><span>Noch keine Sorte im Lager markiert.</span><button type="button" class="btn primary" data-go="lager">Zum Lager ${ic('arrow', 'arrow')}</button></div>`;
    } else {
      h = `<p class="hint">Sorte antippen und einstellen, wie viele Kisten fehlen.</p><ul class="list${anim ? ' anim' : ''}">` + list.map((s, i) => {
        const v = state.bedarf[s.id] || 0;
        return `<li class="tap" style="--i:${i}" data-edit="${s.id}" role="button" tabindex="0" aria-label="${esc(label(s))}, ${v} Kisten"><span class="mono">${esc(initials(brandName(s.b)))}</span><div class="name"><strong>${esc(brandName(s.b))}</strong>${tags(s)}</div><span class="num ${v ? 'has' : 'zero'}${s.id === bumpId ? ' bumped' : ''}">${v}</span></li>`;
      }).join('') + '</ul>';
      h += `<div class="dock"><button type="button" class="btn primary" data-go="tragen"${k ? '' : ' disabled'}>Zur Trageliste ${ic('arrow', 'arrow')}</button></div>`;
    }
    $('v-laden').innerHTML = h;
    bumpId = null;
  }
  function openEditor(id, fresh) {
    editId = id;
    const s = sorte(id), v = state.bedarf[id] || 0;
    const list = ladenSorten(), i = list.findIndex(x => x.id === id), nx = list[i + 1];
    const body = `<div class="grab"></div>
      <div class="shead"><span class="mono">${esc(initials(brandName(s.b)))}</span><div><h3>${esc(brandName(s.b))}</h3>${tags(s)}</div></div>
      <div class="counter"><button type="button" data-step="-1" aria-label="Eine Kiste weniger">${ic('minus')}</button>
        <output id="cnt" aria-live="polite"><b>${v}</b><small>${v === 1 ? 'Kiste' : 'Kisten'}</small></output>
        <button type="button" data-step="1" aria-label="Eine Kiste mehr">${ic('plus')}</button></div>
      <div class="quick">${[0, 1, 2, 3, 5].map(q => `<button type="button" data-set="${q}" aria-pressed="${q === v}">${q}</button>`).join('')}</div>
      <div class="dock"><button type="button" class="btn" data-close="1">Fertig</button>${nx ? `<button type="button" class="btn primary" data-nextedit="${nx.id}">Nächste ${ic('arrow', 'arrow')}</button>` : ''}</div>`;
    const sheet = $('overlay').querySelector('.sheet');
    if (sheet && !fresh) { sheet.innerHTML = body; sheet.setAttribute('aria-label', 'Anzahl für ' + label(s)); animate(sheet, 'fwd'); }
    else $('overlay').innerHTML = `<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-label="Anzahl für ${esc(label(s))}">${body}</div>`;
  }
  function setBedarf(id, v) {
    const old = state.bedarf[id] || 0;
    v = num(v); if (v === old) return;
    if (v) state.bedarf[id] = v; else delete state.bedarf[id];
    delete state.done[id]; state.doneOrder = state.doneOrder.filter(x => x !== id);
    save(); bumpId = id;
    const o = $('cnt');
    if (o) {
      o.innerHTML = `<b class="${reduced ? '' : v > old ? 'up' : 'down'}">${v}</b><small>${v === 1 ? 'Kiste' : 'Kisten'}</small>`;
    }
    document.querySelectorAll('[data-set]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.set === v));
  }
  $('v-laden').addEventListener('click', e => {
    const li = e.target.closest('[data-edit]'); if (li) { openEditor(li.dataset.edit, true); return; }
    const t = e.target.closest('button'); if (t && t.dataset.go) setTab(t.dataset.go);
  });
  $('v-laden').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.edit) { e.preventDefault(); openEditor(e.target.dataset.edit, true); }
  });

  /* Overlay (Sheets) */
  let closing = false;
  function closeOverlay() {
    if (closing || !$('overlay').innerHTML) return;
    closing = true; $('overlay').classList.add('closing');
    later(() => {
      closing = false; $('overlay').classList.remove('closing'); $('overlay').innerHTML = ''; editId = null;
      if (state.tab === 'laden') renderLaden();
      if (state.tab === 'lager') renderLager();
      renderDock();
    }, 170);
  }
  $('overlay').addEventListener('click', e => {
    const t = e.target.closest('[data-close],[data-step],[data-set],[data-nextedit],[data-unmark]'); if (!t) return;
    if (t.dataset.close) closeOverlay();
    else if (t.dataset.step && editId) setBedarf(editId, (state.bedarf[editId] || 0) + +t.dataset.step);
    else if (t.dataset.set && editId) setBedarf(editId, +t.dataset.set);
    else if (t.dataset.nextedit) { renderLaden(); openEditor(t.dataset.nextedit, false); }
    else if (t.dataset.unmark) {
      const li = t.closest('li');
      delete state.avail[t.dataset.unmark]; save();
      const rest = Object.keys(state.avail).length;
      if (li && !reduced) { li.style.transition = 'opacity .18s, transform .18s'; li.style.opacity = '0'; li.style.transform = 'translateX(30px)'; }
      later(() => { if (rest) openReview(); else closeOverlay(); renderLager(); renderDock(); }, 180);
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('overlay').innerHTML) closeOverlay(); });

  /* ---------- Tragen ---------- */
  let showList = false, wake = null, cardDir = null;
  function renderTragen() {
    const all = tragenSorten(), open = openSorten();
    const el = $('v-tragen');
    const rest = open.reduce((a, s) => a + state.bedarf[s.id], 0);
    setTop(showList ? 'Trageliste' : 'Tragen', all.length ? `${open.length} von ${all.length} Sorten offen · ${rest} Kisten` : '', showList ? () => { showList = false; renderTragen(); animate(el, 'back'); } : null);
    if (!all.length) {
      el.innerHTML = `<div class="empty"><span class="glyph">${ic('laden')}</span><span>Noch nichts zu tragen. Trag im Laden ein, wie viele Kisten fehlen.</span><button type="button" class="btn primary" data-go="laden">Zum Laden ${ic('arrow', 'arrow')}</button></div>`;
      return;
    }
    if (showList) {
      el.innerHTML = '<p class="hint">Antippen hakt ab oder öffnet wieder.</p><ul class="list">' + all.map(s => {
        const d = !!state.done[s.id];
        return `<li class="tap${d ? ' done' : ''}" data-flip="${s.id}" role="button" tabindex="0" aria-pressed="${d}"><span class="chk">${ic('check')}</span><div class="name"><strong>${esc(brandName(s.b))}</strong>${tags(s)}</div><span class="num">${state.bedarf[s.id]}</span></li>`;
      }).join('') + '</ul>';
      return;
    }
    if (!open.length) {
      const k = all.reduce((a, s) => a + state.bedarf[s.id], 0);
      el.innerHTML = `<div class="screen"><div class="alldone"><span class="ring">${ic('check')}</span><b>Alles aufgefüllt</b><span class="hint" style="margin:0;font-family:var(--font-num)">${k} Kisten · ${all.length} Sorten</span></div>
        <div class="dock"><button type="button" class="btn" data-undo="1">${ic('undo')}Rückgängig</button><button type="button" class="btn" data-list="1">${ic('list')}Liste</button></div>
        <div class="dock"><button type="button" class="btn primary" data-reset="1">${ic('reset')}Neue Runde</button></div></div>`;
      return;
    }
    const cur = open[0], nx = open[1];
    const doneN = all.length - open.length;
    const enter = cardDir ? ` enter-${cardDir}` : ''; cardDir = null;
    el.innerHTML = `<div class="screen"><button type="button" class="focus${enter}" id="focusCard" aria-label="${esc(label(cur))}, ${state.bedarf[cur.id]} Kisten. Antippen, wenn erledigt.">
        <span class="head"><span>${String(doneN + 1).padStart(2, '0')} / ${String(all.length).padStart(2, '0')}</span><span class="bar"><i style="width:${Math.round(doneN / all.length * 100)}%"></i></span><span>${rest} Ki.</span></span>
        <span class="mid">
          <span class="brand">${esc(brandName(cur.b))}</span>
          <span class="tags"><span class="pill">${ic(cur.pack)}${PACK[cur.pack]}</span><span class="pill t-${cur.typ}">${ic(cur.typ)}${TYP[cur.typ]}</span></span>
          <span class="big">${state.bedarf[cur.id]}</span><span class="unit">${state.bedarf[cur.id] === 1 ? 'Kiste' : 'Kisten'}</span>
        </span>
        <span class="go">${ic('check')}Erledigt</span>
      </button>
      <p class="next">${nx ? `${ic('chev')}<span>Danach <b>${esc(brandName(nx.b))}</b> ${PACK[nx.pack]} ${TYP[nx.typ]} · ${state.bedarf[nx.id]}</span>` : '<span>Letzte Sorte dieser Runde</span>'}</p>
      <div class="dock"><button type="button" class="btn" data-undo="1"${state.doneOrder.length ? '' : ' disabled'}>${ic('undo')}Rückgängig</button><button type="button" class="btn" data-list="1">${ic('list')}Liste</button></div></div>`;
  }
  let leaving = false;
  $('v-tragen').addEventListener('click', e => {
    const card = e.target.closest('#focusCard');
    if (card) {
      if (leaving) return;
      const cur = openSorten()[0]; if (!cur) return;
      leaving = true; card.classList.remove('enter-fwd', 'enter-back'); card.classList.add('leave');
      later(() => { leaving = false; state.done[cur.id] = true; state.doneOrder.push(cur.id); save(); cardDir = 'fwd'; renderTragen(); renderDock(); }, 190);
      return;
    }
    const row = e.target.closest('[data-flip]');
    if (row) {
      const id = row.dataset.flip;
      if (state.done[id]) { delete state.done[id]; state.doneOrder = state.doneOrder.filter(x => x !== id); } else { state.done[id] = true; state.doneOrder.push(id); }
      row.classList.toggle('done', !!state.done[id]); row.setAttribute('aria-pressed', !!state.done[id]);
      save(); renderDock();
      const all = tragenSorten(), open = openSorten(), rest = open.reduce((a, s) => a + state.bedarf[s.id], 0);
      $('topSub').textContent = `${open.length} von ${all.length} Sorten offen · ${rest} Kisten`;
      return;
    }
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.undo) {
      while (state.doneOrder.length) { const id = state.doneOrder.pop(); if (state.done[id]) { delete state.done[id]; break; } }
      save(); cardDir = 'back'; renderTragen(); renderDock();
    } else if (t.dataset.list) { showList = true; renderTragen(); animate($('v-tragen'), 'fwd'); scrollTo(0, 0); }
    else if (t.dataset.go) setTab(t.dataset.go);
    else if (t.dataset.reset) arm(t, 'Wirklich alles zurücksetzen?', newRound);
  });
  $('v-tragen').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.flip) { e.preventDefault(); e.target.click(); }
  });
  async function wakeOn() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } }
  function wakeOff() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.tab === 'tragen') wakeOn(); });

  /* ---------- Einstellungen ---------- */
  function renderSettings() {
    setTop('Einstellungen', `${state.brands.length} Marken · ${state.sorten.length} Sorten`, null);
    const opt = (o, keys, sel) => keys.map(k => `<option value="${k}"${k === sel ? ' selected' : ''}>${o[k]}</option>`).join('');
    let h = state.demo ? '<p class="demo">Demo: Marken, Sorten und Laufweg sind Platzhalter. Alles hier ist änderbar.</p>' : '';
    h += `<div class="label">Ablauf</div><div class="seg${state.mode === 'laden' ? ' right' : ''}" role="group" aria-label="Ablauf"><span class="thumb"></span>
      <button type="button" data-mode="lager" aria-pressed="${state.mode === 'lager'}">${ic('lager')}Lager zuerst</button>
      <button type="button" data-mode="laden" aria-pressed="${state.mode === 'laden'}">${ic('laden')}Laden zuerst</button></div>
      <p class="hint" id="modeHint" style="margin-top:8px">${modeHint()}</p>`;
    h += `<div class="label">Laufweg im Laden</div><p class="hint">Am Griff ziehen oder mit den Pfeilen verschieben. Laden und Trageliste folgen dieser Reihenfolge.</p><ul class="list" id="routeList">`;
    const last = state.sorten.length - 1;
    h += state.sorten.map((s, i) => `<li data-sid="${s.id}"><button type="button" class="handle" aria-label="Ziehen zum Verschieben">${ic('grip')}</button><span class="pos">${String(i + 1).padStart(2, '0')}</span>
      <div class="name"><strong>${esc(brandName(s.b))}</strong>${tags(s)}</div>
      <button type="button" class="ib" data-move="-1" aria-label="Nach oben"${i === 0 ? ' disabled' : ''}>${ic('up')}</button>
      <button type="button" class="ib" data-move="1" aria-label="Nach unten"${i === last ? ' disabled' : ''}>${ic('down')}</button>
      <button type="button" class="ib" data-delsorte="1" aria-label="Sorte löschen">${ic('x')}</button></li>`).join('') || '<li><div class="name"><span class="hint" style="margin:0">Noch keine Sorten.</span></div></li>';
    h += '</ul>';
    h += `<div class="label">Sorte hinzufügen</div><form id="addSorte" class="panel"><div class="row">
      <select class="field" id="asBrand" aria-label="Marke">${state.brands.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>
      <div class="row"><select class="field" id="asPack" aria-label="Glas oder Plastik">${opt(PACK, PACKS)}</select><select class="field" id="asTyp" aria-label="Kohlensäure">${opt(TYP, TYPS)}</select></div>
      <div class="row"><button type="submit" class="btn primary">${ic('plus')}Sorte hinzufügen</button></div><div class="msg" id="asMsg"></div></form>`;
    h += `<div class="label">Marken</div><p class="hint">Löschen entfernt auch alle Sorten dieser Marke.</p><ul class="list">` +
      state.brands.map(b => `<li data-bid="${b.id}"><span class="mono">${esc(initials(b.name))}</span><input class="field" id="bn-${b.id}" value="${esc(b.name)}" aria-label="Markenname"><button type="button" class="ib" data-delbrand="1" aria-label="Marke löschen">${ic('x')}</button></li>`).join('') +
      `</ul><form id="addBrand" class="row" style="margin-top:8px"><input class="field" id="newBrand" placeholder="Neue Marke" autocomplete="off"><button type="submit" class="btn">${ic('plus')}Marke</button></form>`;
    h += `<div class="label">Sicherung</div><div class="panel"><p class="hint">Die Daten liegen nur in diesem Browser. Kopier dir Marken und Laufweg ab und zu weg, z.B. in eine Notiz.</p>
      <button type="button" class="btn" id="copyBtn" style="width:100%">${ic('copy')}Einstellungen kopieren</button>
      <textarea class="field" id="backupText" aria-label="Sicherung als Text" placeholder="Gesicherten Text hier einfügen, dann Übernehmen"></textarea>
      <button type="button" class="btn" id="importBtn" style="width:100%;margin-top:8px">Übernehmen</button><div class="msg" id="backupMsg"></div></div>`;
    h += `<div class="label">Runde</div><button type="button" class="btn" data-reset="1" style="width:100%">${ic('reset')}Neue Runde starten</button>`;
    $('v-settings').innerHTML = h;
  }
  const modeHint = () => state.mode === 'lager' ? 'Erst im Lager antippen, welche Sorten da sind, dann im Laden die Anzahl eintragen.' : 'Ohne Lagerschritt: im Laden direkt bei allen Sorten die Anzahl eintragen.';
  const edited = () => { state.demo = false; };
  const dropSorte = id => { delete state.avail[id]; delete state.bedarf[id]; delete state.done[id]; state.doneOrder = state.doneOrder.filter(x => x !== id); };
  const msg = (id, t, err) => { const m = $(id); if (m) { m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); } };
  const rerenderKeep = () => { const y = scrollY; renderSettings(); scrollTo(0, y); };

  $('v-settings').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.mode) {
      state.mode = t.dataset.mode; save();
      const seg = t.closest('.seg'); seg.classList.toggle('right', state.mode === 'laden');
      seg.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
      $('modeHint').textContent = modeHint(); renderDock(); return;
    }
    if (t.dataset.reset) { arm(t, 'Wirklich alles zurücksetzen?', newRound); return; }
    const li = t.closest('li');
    if (t.dataset.move && li) {
      const i = state.sorten.findIndex(s => s.id === li.dataset.sid), to = i + +t.dataset.move;
      if (to < 0 || to >= state.sorten.length) return;
      [state.sorten[i], state.sorten[to]] = [state.sorten[to], state.sorten[i]];
      edited(); save(); rerenderKeep();
      const moved = document.querySelector(`[data-sid="${li.dataset.sid}"]`);
      if (moved && !reduced) moved.animate([{ background: 'rgba(77,141,255,.18)' }, { background: 'transparent' }], { duration: 500, easing: 'ease-out' });
      const b = moved && moved.querySelector(`[data-move="${t.dataset.move}"]`); if (b && !b.disabled) b.focus({ preventScroll: true });
      return;
    }
    if (t.dataset.delsorte && li) {
      arm(t, 'Löschen?', () => { const id = li.dataset.sid; state.sorten = state.sorten.filter(s => s.id !== id); dropSorte(id); edited(); save(); rerenderKeep(); renderDock(); });
      return;
    }
    if (t.dataset.delbrand && li) {
      arm(t, 'Mit Sorten löschen?', () => {
        const bid = li.dataset.bid;
        state.sorten.filter(s => s.b === bid).forEach(s => dropSorte(s.id));
        state.sorten = state.sorten.filter(s => s.b !== bid); state.brands = state.brands.filter(b => b.id !== bid);
        edited(); save(); rerenderKeep(); renderDock();
      });
      return;
    }
    if (t.id === 'copyBtn') {
      const text = JSON.stringify({ kistenliste: 2, brands: state.brands, sorten: state.sorten.map(s => ({ b: s.b, pack: s.pack, typ: s.typ })) });
      $('backupText').value = text;
      const fallback = () => { $('backupText').select(); msg('backupMsg', 'Text oben markiert. Bitte selbst kopieren.'); };
      try { navigator.clipboard.writeText(text).then(() => msg('backupMsg', 'Kopiert. Füg es z.B. in eine Notiz ein.'), fallback); } catch (err) { fallback(); }
      return;
    }
    if (t.id === 'importBtn') {
      let data;
      try { data = JSON.parse($('backupText').value); } catch (err) { data = null; }
      if (!data || !Array.isArray(data.brands) || !Array.isArray(data.sorten)) { msg('backupMsg', 'Das ist keine gültige Sicherung. Füg den kompletten kopierten Text ein.', true); return; }
      arm(t, 'Aktuelle Einstellungen ersetzen?', () => {
        state.brands = data.brands.map(b => ({ id: String(b.id), name: String(b.name) }));
        state.sorten = data.sorten.filter(s => PACK[s.pack] && TYP[s.typ]).map(s => ({ id: uid(), b: String(s.b), pack: s.pack, typ: s.typ }));
        state.avail = {}; state.bedarf = {}; state.done = {}; state.doneOrder = []; state.demo = false;
        save(); rerenderKeep(); renderDock(); msg('backupMsg', `${state.brands.length} Marken und ${state.sorten.length} Sorten übernommen.`);
      });
    }
  });
  $('v-settings').addEventListener('input', e => {
    const li = e.target.closest('[data-bid]');
    if (li && e.target.tagName === 'INPUT') { const b = state.brands.find(x => x.id === li.dataset.bid); if (b) { b.name = e.target.value; edited(); save(); const m = li.querySelector('.mono'); if (m) m.textContent = initials(b.name || '?'); } }
  });
  $('v-settings').addEventListener('change', e => { if (e.target.closest('[data-bid]')) rerenderKeep(); });
  $('v-settings').addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'addBrand') {
      const v = $('newBrand').value.trim(); if (!v) return;
      state.brands.push({ id: uid(), name: v }); edited(); save(); rerenderKeep(); $('newBrand').focus();
    }
    if (e.target.id === 'addSorte') {
      const b = $('asBrand').value, pack = $('asPack').value, typ = $('asTyp').value;
      if (!b) { msg('asMsg', 'Lege zuerst eine Marke an.', true); return; }
      if (state.sorten.some(s => s.b === b && s.pack === pack && s.typ === typ)) { msg('asMsg', `${brandName(b)} ${PACK[pack]} ${TYP[typ]} gibt es schon.`, true); return; }
      state.sorten.push({ id: uid(), b, pack, typ }); edited(); save(); rerenderKeep();
      $('asBrand').value = b; $('asPack').value = pack; $('asTyp').value = typ;
      msg('asMsg', `${brandName(b)} ${PACK[pack]} ${TYP[typ]} steht jetzt am Ende des Laufwegs.`);
    }
  });

  /* Ziehen am Griff */
  let drag = null;
  $('v-settings').addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle'); if (!h) return;
    e.preventDefault();
    const li = h.closest('li'); drag = { li, list: li.parentElement, id: e.pointerId };
    li.classList.add('dragging'); try { h.setPointerCapture(e.pointerId); } catch (err) {}
  });
  $('v-settings').addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const y = e.clientY;
    if (y < 90) scrollBy(0, -10); else if (y > innerHeight - 140) scrollBy(0, 10);
    const rows = [...drag.list.children].filter(r => r !== drag.li);
    const before = rows.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
    if (before) { if (drag.li.nextElementSibling !== before) drag.list.insertBefore(drag.li, before); }
    else if (drag.list.lastElementChild !== drag.li) drag.list.appendChild(drag.li);
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const order = [...drag.list.children].map(r => r.dataset.sid);
    const map = Object.fromEntries(state.sorten.map(s => [s.id, s]));
    const next = order.map(id => map[id]).filter(Boolean);
    const changed = next.length === state.sorten.length && next.some((s, i) => s !== state.sorten[i]);
    drag = null;
    if (changed) { state.sorten = next; edited(); save(); }
    rerenderKeep();
  };
  $('v-settings').addEventListener('pointerup', endDrag);
  $('v-settings').addEventListener('pointercancel', endDrag);

  /* ---------- Werkzeugleiste ---------- */
  let indReady = false;
  function placeInd(noanim) {
    const cur = $('dock').querySelector('[aria-current="true"]'), ind = $('dock').querySelector('.ind');
    if (!cur || !ind) return;
    ind.classList.toggle('noanim', !!noanim);
    ind.style.width = cur.offsetWidth + 'px';
    ind.style.transform = `translateX(${cur.offsetLeft}px)`;
  }
  function renderDock() {
    const tabs = (state.mode === 'lager' ? [['lager', 'Lager']] : []).concat([['laden', 'Laden'], ['tragen', 'Tragen'], ['settings', 'Einstellungen']]);
    const icon = { lager: 'lager', laden: 'laden', tragen: 'tragen', settings: 'set' };
    const openN = openSorten().length;
    let ind = $('dock').querySelector('.ind');
    const prev = ind ? { w: ind.style.width, t: ind.style.transform } : null;
    $('dock').innerHTML = '<span class="ind noanim"></span>' + tabs.map(([k, l]) => `<button type="button" data-tab="${k}" aria-current="${state.tab === k}">${ic(icon[k])}<span>${l}</span>${k === 'tragen' && openN ? `<span class="badge">${openN}</span>` : ''}</button>`).join('');
    ind = $('dock').querySelector('.ind');
    if (prev && indReady) { ind.style.width = prev.w; ind.style.transform = prev.t; void ind.offsetWidth; placeInd(false); }
    else { placeInd(true); indReady = true; }
  }
  /* Platz zwischen Kopfleiste und schwebender Leiste messen, damit Kacheln genau den Bildschirm füllen */
  function measure() {
    try {
      const top = document.querySelector('.top').getBoundingClientRect();
      const dock = document.querySelector('nav.dockbar').getBoundingClientRect();
      const avail = Math.max(320, Math.round(dock.top - top.bottom - 12));
      document.documentElement.style.setProperty('--avail', avail + 'px');
    } catch (e) {}
  }
  const onResize = () => { placeInd(true); measure(); };
  addEventListener('resize', onResize);
  try { visualViewport.addEventListener('resize', onResize); } catch (e) {}
  try { document.fonts.ready.then(onResize); } catch (e) {}

  function setTab(t) {
    if (t === 'lager' && state.mode !== 'lager') t = 'laden';
    const changed = state.tab !== t;
    state.tab = t; save();
    $('overlay').innerHTML = ''; $('overlay').classList.remove('closing'); editId = null;
    ['lager', 'laden', 'tragen', 'settings'].forEach(x => { $('v-' + x).hidden = x !== t; });
    if (t === 'lager') { state.nav = { pack: null, typ: null }; renderLager(); }
    if (t === 'laden') renderLaden(true);
    if (t === 'tragen') { showList = false; renderTragen(); wakeOn(); } else wakeOff();
    if (t === 'settings') renderSettings();
    if (changed || !indReady) animate($('v-' + t), 'fade');
    renderDock(); measure(); scrollTo(0, 0);
  }
  $('dock').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  setTab(state.tab || 'lager');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
